server {
    listen 80;
    listen [::]:80;
    server_name pilorama-razbegaevo.ru www.pilorama-razbegaevo.ru;
    access_log off;
    error_log /var/log/nginx/piloproject-error.log crit;
    server_tokens off;
    return 301 https://pilorama-razbegaevo.ru$request_uri;
}

server {
    # HTTP/2: на проде nginx/1.24.0 (Ubuntu 24.04), директива `http2 on;`
    # появилась только в 1.25.1 и на 1.24.0 уронит `nginx -t`. Поэтому здесь
    # и в основном сервере ниже используется старая форма — параметр `http2`
    # у `listen`. При обновлении nginx до 1.25.1+ (проверить `nginx -v` перед
    # применением) правильная форма — `listen 443 ssl;` / `listen [::]:443 ssl;`
    # плюс отдельная строка `http2 on;`; форма `ssl http2` в `listen` в новых
    # версиях объявлена устаревшей.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pilorama-razbegaevo.ru;

    ssl_certificate /etc/letsencrypt/live/pilorama-razbegaevo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilorama-razbegaevo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    error_log /var/log/nginx/piloproject-error.log crit;
    server_tokens off;

    # Заголовки нужны и на 301 с www: браузер, пришедший на www, должен
    # получить HSTS, иначе следующий заход снова пойдёт по HTTP.
    include /etc/nginx/snippets/piloproject-security-headers.conf;

    return 301 https://pilorama-razbegaevo.ru$request_uri;
}

server {
    # HTTP/2, форма для nginx < 1.25.1 — см. комментарий у редирект-сервера
    # www выше, там же и форма для nginx ≥ 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pilorama-razbegaevo.ru;

    ssl_certificate /etc/letsencrypt/live/pilorama-razbegaevo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilorama-razbegaevo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/piloproject;
    index index.html;
    charset utf-8;

    access_log off;
    error_log /var/log/nginx/piloproject-error.log crit;
    server_tokens off;

    client_max_body_size 1m;

    # Типы для .vtt и .xsl задаются точечно в location ниже через
    # `types { } default_type ...`, а не блоком `types { }` на уровне server.
    # Причина: блок `types { }` в любом контексте ПОЛНОСТЬЮ заменяет
    # унаследованную карту MIME-типов, а подключить внутрь него
    # `include /etc/nginx/mime.types;` нельзя — этот файл сам обёрнут в
    # `types { ... }`, и nginx падает с «unexpected "{" in mime.types:2».

    # Сжатие текстовых ответов. text/html в gzip_types не добавляем: nginx
    # сжимает text/html всегда, независимо от gzip_types. CSS почти весь
    # инлайн в HTML и сжимается вместе с ним; внешних CSS-файлов два маленьких
    # и они тоже попадают под text/css ниже.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # `text/javascript` рядом с `application/javascript` — страховка: в
    # mime.types этого сервера `.js` отдаётся как application/javascript,
    # но в свежих сборках nginx тип для `.js` менялся, и без второй строки
    # сжатие JS тихо перестало бы работать.
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/xml application/xml text/plain text/vtt text/xsl;
    # `gzip_static on;` не включаем: сборка не создаёт .gz файлы заранее —
    # это отдельная опция `nitro.compressPublicAssets` в frontend/nuxt.config.ts,
    # в этом релизе не включена. Если её включат, можно будет добавить
    # `gzip_static on;` и оставить `gzip on;` как запасной вариант для файлов
    # без готовой .gz-пары. Brotli в стоковом nginx нет, не обещаем.

    # Все add_header (CSP, Permissions-Policy, Referrer-Policy,
    # X-Content-Type-Options, X-Frame-Options, HSTS) вынесены в отдельный
    # файл — см. комментарий в deploy/nginx-security-headers.conf. Подключаем
    # его и здесь на уровне server, и повторно в каждом location ниже, где
    # есть свой add_header (иначе из-за наследования nginx заголовки в этих
    # location не отдавались бы вовсе).
    include /etc/nginx/snippets/piloproject-security-headers.conf;

    # Страница 404: SSR-страница `/not-found`, nuxt generate кладёт её как
    # `/not-found/index.html` (frontend/pages/not-found.vue, делает субагент A;
    # см. contract.md п. 7). Прежние `error_page 404 /404.html;` и
    # `location = /404.html { internal; }` убраны, а не оставлены запасным
    # вариантом: `error_page` для одного кода ответа может указывать только
    # на одну цель, старая пустая SPA-оболочка и новая SSR-страница
    # одновременно работать не могут, и тогда старая пара директив была бы
    # просто мёртвым кодом. `nuxt generate` по-прежнему кладёт пустой
    # `404.html` в сборку (это делает Nitro сам для статических хостингов),
    # но nginx на него больше не ссылается. Если `/not-found/index.html`
    # вдруг отсутствует на диске, nginx отдаст свою короткую служебную
    # страницу с кодом 404 (рекурсии в error_page нет) — сайт не сломается,
    # просто без оформленного тела.
    error_page 404 /not-found/index.html;

    location = /not-found/index.html {
        internal;
    }

    # Прямой заход на /not-found (без index.html) — тоже 404: страница
    # служебная, у неё noindex, в обычной навигации ссылок на неё нет.
    location = /not-found {
        return 404;
    }

    # Страница-оболочка нужна только на время самой первой установки
    # (deploy/bootstrap-vps.sh, до выпуска сертификата) — отдавать её с
    # кодом 200 после релиза не должны.
    location = /200.html {
        return 404;
    }

    # `nuxt generate` всегда кладёт в сборку пустой `404.html` без SSR (это
    # делает Nitro для статических хостингов). Сам nginx на него больше не
    # ссылается — `error_page` ведёт на `/not-found/index.html`, — но без
    # этого location прямой заход на `/404.html` попал бы в `location /` и
    # отдал 200 с пустой оболочкой: ещё одна тонкая страница в индексе, как
    # было с `/200.html`.
    location = /404.html {
        return 404;
    }

    # 301 для двойного слэша (`//doska` и т.п.). $request_uri — исходный,
    # необработанный URI, в нём двойной слэш ещё виден; $uri уже нормализован
    # nginx (`merge_slashes on` по умолчанию схлопывает подряд идущие
    # слэши), поэтому редирект на $uri убирает дубль без ручной склейки.
    if ($request_uri ~ "^[^?]*//") {
        return 301 $uri$is_args$args;
    }

    # 301 для `/index.html`, `/doska/index.html` и т.п. на путь без него.
    # Не `location = /index.html`: с директивой `index index.html;` это дало
    # бы петлю (location вернул бы редирект, `index` на этот же файл снова
    # бы его подставил). Через $request_uri и regex в `if` — без петли.
    # Для корня `$1` получается "/", а не пустая строка: группа `(/.*?)`
    # обязательно захватывает ведущий слэш первым же (лениво минимальным)
    # совпадением, поэтому `/index.html` разбирается как $1="/" + `index.html`,
    # а не как пустой $1. Проверено разбором регулярного выражения вручную
    # для `/index.html` → `/`, `/doska/index.html` → `/doska`,
    # `//index.html` → `/` (двойной слэш до этого места уже не доходит —
    # выше в `if` его превратит в `/index.html`, а уже следующий запрос
    # браузера попадёт под это правило).
    if ($request_uri ~ "^(/.*?)/?index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    # Канонические URL — без завершающего слэша (как в sitemap и canonical).
    rewrite ^/(.+)/$ /$1 permanent;

    location /_nuxt/ {
        try_files $uri =404;
        include /etc/nginx/snippets/piloproject-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # WebP-вариант `/_ipx/…` — регулярный location специально стоит ДО
    # префиксного `location /_ipx/` ниже по тексту файла. Правило выбора у
    # nginx такое: сначала ищется самый длинный подходящий префиксный
    # location (здесь это `/_ipx/`), и, если он не помечен `^~`, nginx
    # дополнительно проверяет все `location` с регулярными выражениями и
    # использует первый совпавший вместо префиксного. Если бы регулярных
    # location для `_ipx` было несколько, побеждал бы тот, что раньше по
    # тексту файла — здесь он один, но порядок оставлен как более читаемый
    # и явно предписанный: сначала частный случай, потом общий.
    # nginx отдаёт `/_ipx/f_webp…` с MIME-типом файла-источника (image/jpeg
    # или image/png), хотя по факту в теле WebP. `types { }` (пустой блок)
    # очищает карту типов только для этого location — без него расширение
    # исходного файла перебило бы `default_type`; `default_type` подставляет
    # верный тип.
    location ~ ^/_ipx/[^/]*f_webp {
        try_files $uri =404;
        types { }
        default_type image/webp;
        include /etc/nginx/snippets/piloproject-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location /_ipx/ {
        try_files $uri =404;
        include /etc/nginx/snippets/piloproject-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location /images/ {
        try_files $uri =404;
        include /etc/nginx/snippets/piloproject-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location /mp4/ {
        try_files $uri =404;
        include /etc/nginx/snippets/piloproject-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # На момент релиза каталог существует и содержит один файл субтитров
    # (frontend/public/captions/short-sawmill-video.ru.vtt); location
    # безвреден и в случае, если каталог опустеет.
    # Субтитры видео на /foto. Пустой `types { }` очищает карту типов только
    # для этого location, после чего срабатывает `default_type` — иначе .vtt
    # уходит как application/octet-stream.
    location /captions/ {
        try_files $uri =404;
        types { }
        default_type text/vtt;
        include /etc/nginx/snippets/piloproject-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Таблица стилей sitemap (/__sitemap__/style.xsl) — тем же приёмом,
    # иначе браузер получает application/octet-stream и не применяет её.
    location ~ \.xsl$ {
        try_files $uri =404;
        types { }
        default_type text/xsl;
        include /etc/nginx/snippets/piloproject-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /favicon.ico {
        try_files $uri =404;
        include /etc/nginx/snippets/piloproject-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /favicon.svg {
        try_files $uri =404;
        include /etc/nginx/snippets/piloproject-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /apple-touch-icon.png {
        try_files $uri =404;
        include /etc/nginx/snippets/piloproject-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        # $uri/index.html вместо $uri/ — отдаёт /doska без 301 на /doska/.
        try_files $uri $uri/index.html $uri.html =404;
    }
}

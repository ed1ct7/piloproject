server {
    listen 80;
    listen [::]:80;
    server_name pilorama-razbegaevo.ru www.pilorama-razbegaevo.ru;
    return 301 https://pilorama-razbegaevo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.pilorama-razbegaevo.ru;

    ssl_certificate /etc/letsencrypt/live/pilorama-razbegaevo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilorama-razbegaevo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://pilorama-razbegaevo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pilorama-razbegaevo.ru;

    ssl_certificate /etc/letsencrypt/live/pilorama-razbegaevo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilorama-razbegaevo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/piloproject;
    index index.html;

    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://pilorama-razbegaevo.ru; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; media-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /_nuxt/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_ipx/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }
}

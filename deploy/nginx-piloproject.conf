server {
    listen 80;
    listen [::]:80;
    server_name pilorama-razbegaevo.ru www.pilorama-razbegaevo.ru;
    access_log off;
    error_log /var/log/nginx/piloproject-error.log crit;
    server_tokens off;
    return 301 https://pilorama-razbegaevo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.pilorama-razbegaevo.ru;

    ssl_certificate /etc/letsencrypt/live/pilorama-razbegaevo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilorama-razbegaevo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    error_log /var/log/nginx/piloproject-error.log crit;
    server_tokens off;

    return 301 https://pilorama-razbegaevo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pilorama-razbegaevo.ru;

    ssl_certificate /etc/letsencrypt/live/pilorama-razbegaevo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilorama-razbegaevo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/piloproject;
    index index.html;

    access_log off;
    error_log /var/log/nginx/piloproject-error.log crit;
    server_tokens off;

    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'none'; frame-src 'none'; frame-ancestors 'none'; img-src 'self' data:; media-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    error_page 404 /404.html;

    # Канонические URL — без завершающего слэша (как в sitemap и canonical).
    rewrite ^/(.+)/$ /$1 permanent;

    location = /404.html {
        internal;
    }

    location /_nuxt/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_ipx/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        # $uri/index.html вместо $uri/ — отдаёт /doska без 301 на /doska/.
        try_files $uri $uri/index.html $uri.html =404;
    }
}

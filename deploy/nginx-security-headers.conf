# Security-заголовки ответа сайта.
#
# Вынесены в отдельный include-файл, потому что nginx наследует `add_header`
# от родительского уровня, только если в текущем блоке (server/location) нет
# ни одного собственного `add_header`. В location /_nuxt/ и /_ipx/ уже стоит
# свой `add_header Cache-Control`, поэтому без явного `include` этого файла
# в такой location все заголовки ниже (CSP, HSTS и т.д.) с сервера туда не
# попадут — раньше это было известным ограничением (см. docs/security.md).
# `include` подставляет строки как часть текущего блока ещё до применения
# правил наследования, поэтому такой способ работает.
#
# Подключать `include`:
#   - в server (порт 443, основной домен pilorama-razbegaevo.ru);
#   - в каждом location, где есть собственный `add_header` (сейчас это
#     /_nuxt/, /_ipx/, /_ipx/…f_webp, /images/, /mp4/, /captions/,
#     /favicon.ico, /favicon.svg, /apple-touch-icon.png).
#
# CSP должен дословно совпадать со значением `securityHeaders` в
# `frontend/nuxt.config.ts` — сверять при любом изменении одного из файлов.
#
# Устанавливается install-release.sh как
# /etc/nginx/snippets/piloproject-security-headers.conf.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'none'; frame-src 'none'; frame-ancestors 'none'; img-src 'self' data:; media-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# HSTS: max-age 2592000 c (30 дней), без `preload` и без `includeSubDomains`.
# Короткий срок — потому что сайт молодой, TLS и конфиг ещё меняются, а
# `preload`/`includeSubDomains` откатить нельзя (preload-список браузеров не
# отпускает домен быстро, а поддоменов с другими требованиями к TLS в проекте
# пока нет, но заявлять о них заранее рискованно). Срок можно увеличивать
# постепенно после того, как HTTPS и текущий конфиг отработают стабильно.
add_header Strict-Transport-Security "max-age=2592000" always;
